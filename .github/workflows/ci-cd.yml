name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Same shell on Linux and Windows self-hosted runners
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install flake8 ruff
      - name: Lint with flake8
        run: flake8 src/ tests/
      - name: Lint with ruff
        run: ruff check src/ tests/

  test:
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov=api --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  build:
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: test -f .env || cp .env.example .env
      - name: Build Docker images
        run: docker compose build

  deploy:
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: test -f .env || cp .env.example .env
      - name: Deploy services
        run: docker compose up -d --build
      - name: Health check
        run: |
          API_PORT=$(grep -E '^API_PORT=' .env | cut -d= -f2 | tr -d '\r')
          for i in $(seq 1 30); do
            curl -fs "http://localhost:${API_PORT:-8000}/health" && exit 0
            sleep 5
          done
          echo "API did not become healthy" && exit 1
