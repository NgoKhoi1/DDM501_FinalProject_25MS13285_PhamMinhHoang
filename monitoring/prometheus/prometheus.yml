global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi_serving'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'evidently'
    static_configs:
      - targets: ['evidently:8001']

  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow-statsd:9102']
